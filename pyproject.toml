[project]
name = "research-copilot"
version = "0.1.0"
description = "Multi-agent AI Research Copilot with LangGraph, pgvector RAG, FastAPI, and Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=0.2.35",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-openai>=0.2.0",
    "tavily-python>=0.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.5",
    "pypdf>=5.0.0",
    "langfuse>=2.50.0",
    "sse-starlette>=2.1.3",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
frontend = [
    "streamlit>=1.39.0",
]
evals = [
    "ragas>=0.2.0",
    "datasets>=3.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.mypy.overrides]]
module = ["tavily", "tavily.*"]
ignore_missing_imports = true
