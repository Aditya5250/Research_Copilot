services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: research_copilot_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: research_copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
